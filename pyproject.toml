[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-fomo"
version = "0.1.0"
description = "Roman WFI PSF test bench: simulations, PSF moments and Piff fits of simulations and real data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Federico Berlfein" }]
requires-python = ">=3.10"
# Piff is deliberately not listed: install the pinned clone of Piff `main` yourself
# (see README). The PyPI release is older than the version this package is built against.
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "pyyaml",
    "galsim>=2.8",
    "ngmix",
    "treecorr",
]

[project.optional-dependencies]
dev = ["pytest"]
# psf_fomo.utils: ASDF → FITS conversion, SEP detection, Gaia matching, remote downloads.
utils = ["asdf", "asdf-astropy", "roman_datamodels", "gwcs", "sep>=1.4", "astroquery",
         "fsspec", "aiohttp", "s3fs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (Roman getPSF calls at Piff's pupil_bin=4) are skipped by default.
# Run them with `pytest -m slow`; the last -m on the command line wins.
addopts = "-m 'not slow'"
markers = [
    "slow: tests that call galsim.roman.getPSF or run Piff fits (minutes)",
]
