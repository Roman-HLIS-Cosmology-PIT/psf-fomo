# Conda environment for psf-fomo.
#   conda env create -f environment.yml
#   conda activate psf-fomo
# Then install Piff from the pinned commit and psf-fomo itself (see README.md).
name: psf-fomo
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - astropy
  - matplotlib
  - pyyaml
  - galsim>=2.8
  - ngmix
  - treecorr
  - pytest
  - jupyterlab
  - pip
